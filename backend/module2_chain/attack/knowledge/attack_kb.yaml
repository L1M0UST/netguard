version: "1.0.0"
description: >
  Deterministic ATT&CK + behaviour knowledge base used by Module 2 before any
  LLM reasoning.  Rules are keyword/category/port/protocol driven so that the
  first-pass technique mapping stays explainable and reproducible.
  Only the *candidate* subset is ever sent to the LLM.

# --------------------------------------------------------------------------
# Tactics (order = canonical attack progression used by the chain builder)
# --------------------------------------------------------------------------
tactic_order:
  - TA0043
  - TA0042
  - TA0001
  - TA0002
  - TA0003
  - TA0004
  - TA0005
  - TA0006
  - TA0007
  - TA0008
  - TA0009
  - TA0011
  - TA0010
  - TA0040

tactics:
  TA0043: {name: Reconnaissance, order: 1}
  TA0042: {name: Resource Development, order: 2}
  TA0001: {name: Initial Access, order: 3}
  TA0002: {name: Execution, order: 4}
  TA0003: {name: Persistence, order: 5}
  TA0004: {name: Privilege Escalation, order: 6}
  TA0005: {name: Defense Evasion, order: 7}
  TA0006: {name: Credential Access, order: 8}
  TA0007: {name: Discovery, order: 9}
  TA0008: {name: Lateral Movement, order: 10}
  TA0009: {name: Collection, order: 11}
  TA0011: {name: Command and Control, order: 12}
  TA0010: {name: Exfiltration, order: 13}
  TA0040: {name: Impact, order: 14}

# --------------------------------------------------------------------------
# Behaviour categories: derived from L1 rule names / detector / reason text.
# They drive correlation (behaviour affinity) and candidate ATT&CK mapping.
# --------------------------------------------------------------------------
categories:
  reconnaissance:
    label: Reconnaissance
    tactic: TA0043
    severity_hint: low
    keywords: [scan, portscan, port_scan, sweep, probe, ping sweep, nmap, masscan, footprint, enumeration, recon]
  brute_force:
    label: Brute Force
    tactic: TA0006
    severity_hint: medium
    keywords: [brute, brute_force, bruteforce, password spray, failed login, auth failure, authentication failure, login failure, ssh_fail, rdp_fail, credential stuffing, non_existent_user]
  exploitation:
    label: Exploitation
    tactic: TA0001
    severity_hint: high
    keywords: [exploit, exploitation, cve-, vuln, rce, shellcode, overflow, deserialization, injection, webshell upload, log4shell, eternalblue, struts]
  malicious_communication:
    label: Malicious Communication
    tactic: TA0011
    severity_hint: high
    keywords: [c2, c&c, beacon, callback, dga, botnet, malware, trojan, backdoor, rat, mining, cryptominer, malicious domain, dns tunnel, reverse shell]
  command_execution:
    label: Command Execution
    tactic: TA0002
    severity_hint: high
    keywords: [command execution, cmd, powershell, bash, wmic, shell, script, interpreter, process creation, command_and_control_exec, exec]
  persistence:
    label: Persistence
    tactic: TA0003
    severity_hint: high
    keywords: [persistence, scheduled task, cron, registry run, service install, startup, autorun, bootkit]
  privilege_escalation:
    label: Privilege Escalation
    tactic: TA0004
    severity_hint: high
    keywords: [privilege escalation, privesc, sudo, setuid, token, uac bypass, kernel exploit, root]
  defense_evasion:
    label: Defense Evasion
    tactic: TA0005
    severity_hint: medium
    keywords: [defense evasion, disable av, disable firewall, obfuscation, encoded command, base64, rootkit, log deletion, tamper, impersonation]
  credential_access:
    label: Credential Access
    tactic: TA0006
    severity_hint: high
    keywords: [credential, password dump, lsass, mimikatz, kerberoast, keylog, hash dump, secretsdump, sam dump, shadow]
  discovery:
    label: Discovery
    tactic: TA0007
    severity_hint: low
    keywords: [discovery, enumeration, net view, whoami, host discovery, service discovery, asset discovery, share enumeration, smb enumeration]
  lateral_movement:
    label: Lateral Movement
    tactic: TA0008
    severity_hint: critical
    keywords: [lateral movement, smb admin, psexec, wmi exec, remote service, pass the hash, remote desktop, ssh hop, internal pivot, winrm]
  collection:
    label: Collection
    tactic: TA0009
    severity_hint: high
    keywords: [collection, archive, compress, staging, screen capture, keylogging, data collection, file gather]
  command_and_control:
    label: Command and Control
    tactic: TA0011
    severity_hint: high
    keywords: [command and control, c2 channel, beaconing, dns tunneling, remote access trojan, c2 domain]
  exfiltration:
    label: Exfiltration
    tactic: TA0010
    severity_hint: critical
    keywords: [exfiltration, data transfer out, upload, dns exfil, large outbound, data leak, transfer to external]
  impact:
    label: Impact
    tactic: TA0040
    severity_hint: critical
    keywords: [impact, ransomware, encryption, wipe, destructive, dos, denial of service, deface, data destruction, extortion]

# --------------------------------------------------------------------------
# Techniques: deterministic candidate generation.
# A technique is emitted when any of keywords/detectors/categories/ports
# matches the candidate's aggregated signals.
# --------------------------------------------------------------------------
