# Working directory: cqsec8b. Synthetic data only; never a production model.
model_name_or_path: ./models/Qwen3-8B
trust_remote_code: false
stage: sft
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
quantization_bit: 4
quantization_method: bnb
quantization_type: nf4
double_quantization: true
dataset_dir: ./data/smoke
dataset: cqsec_smoke_train
eval_dataset: cqsec_smoke_dev
template: qwen3_nothink
cutoff_len: 1024
preprocessing_num_workers: 2
output_dir: ./runs/smoke
logging_steps: 1
save_steps: 5
save_total_limit: 2
report_to: none
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
max_steps: 5
learning_rate: 5.0e-5
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
gradient_checkpointing: true
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 5
seed: 42
