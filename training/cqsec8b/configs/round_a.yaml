# Requires audited train/dev JSONL and dataset_info.json under data/round_a.
# These settings are starting points, not evidence of GPU compatibility.
model_name_or_path: ./models/Qwen3-8B
trust_remote_code: false
stage: sft
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
quantization_bit: 4
quantization_method: bnb
quantization_type: nf4
double_quantization: true
dataset_dir: ./data/round_a
dataset: cqsec_a_train
eval_dataset: cqsec_a_dev
template: qwen3_nothink
cutoff_len: 2048
preprocessing_num_workers: 4
output_dir: ./runs/round_a
logging_steps: 10
save_steps: 200
save_total_limit: 20
report_to: none
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
num_train_epochs: 1.0
learning_rate: 5.0e-5
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
gradient_checkpointing: true
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 200
seed: 42
