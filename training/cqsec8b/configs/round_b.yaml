# Continue the selected A adapter. Requires reviewed B data including replay.
model_name_or_path: ./models/Qwen3-8B
adapter_name_or_path: ./runs/round_a
trust_remote_code: false
stage: sft
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
quantization_bit: 4
quantization_method: bnb
quantization_type: nf4
double_quantization: true
dataset_dir: ./data/round_b
dataset: cqsec_b_train
eval_dataset: cqsec_b_dev
template: qwen3_nothink
cutoff_len: 4096
preprocessing_num_workers: 4
output_dir: ./runs/round_b
logging_steps: 10
save_steps: 100
save_total_limit: 20
report_to: none
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
num_train_epochs: 1.0
learning_rate: 5.0e-5
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
gradient_checkpointing: true
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 100
seed: 42
